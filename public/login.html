<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>j4ke-IA — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #00d4ff;
  --cyan-bright: #00f5ff;
  --green: #00ff88;
  --red: #ff3565;
  --gold: #ffc34d;
  --purple: #a855f7;
  --bg-deep: #030610;
  --bg-base: #050a1a;
  --bg-elevated: #0a1428;
  --text-primary: #f0f6ff;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.bg-grid {
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(0, 212, 255, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none; z-index: 0;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
}

.bg-glow {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
}
.bg-glow::before {
  content: '';
  position: absolute;
  top: 10%; left: -10%;
  width: 50%; height: 50%;
  background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
  filter: blur(60px);
  animation: floatGlow 20s ease-in-out infinite;
}
.bg-glow::after {
  content: '';
  position: absolute;
  bottom: 10%; right: -10%;
  width: 50%; height: 50%;
  background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, transparent 70%);
  filter: blur(60px);
  animation: floatGlow 25s ease-in-out infinite reverse;
}
@keyframes floatGlow {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(50px, 30px) scale(1.1); }
}

.particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
.particle {
  position: absolute; width: 2px; height: 2px;
  background: var(--cyan); border-radius: 50%;
  box-shadow: 0 0 6px var(--cyan);
  animation: floatUp linear infinite; opacity: 0.5;
}
@keyframes floatUp {
  0% { transform: translateY(100vh); opacity: 0; }
  10% { opacity: 0.5; }
  90% { opacity: 0.5; }
  100% { transform: translateY(-100vh); opacity: 0; }
}

.top-bar {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 10; padding: 16px 24px;
  background: rgba(3, 6, 16, 0.7);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  display: flex; align-items: center; justify-content: space-between;
}

.logo {
  font-family: 'Orbitron', monospace;
  font-size: 20px; font-weight: 900; letter-spacing: 4px;
  background: linear-gradient(135deg, var(--cyan-bright) 0%, var(--purple) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  text-decoration: none;
}

.top-bar nav a {
  color: var(--text-secondary); font-size: 13px;
  text-decoration: none; font-weight: 500; transition: color 0.2s;
}
.top-bar nav a:hover { color: var(--cyan-bright); }

.login-card {
  position: relative; z-index: 2;
  background: linear-gradient(135deg, rgba(10, 20, 40, 0.85), rgba(15, 23, 41, 0.75));
  border: 1px solid rgba(0, 212, 255, 0.2);
  border-radius: 20px;
  padding: 44px 40px;
  max-width: 480px; width: 100%;
  backdrop-filter: blur(20px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 212, 255, 0.08);
  animation: cardAppear 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  margin-top: 40px;
}

@keyframes cardAppear {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.title-area { text-align: center; margin-bottom: 32px; }
.title-tag {
  display: inline-block;
  padding: 6px 14px;
  background: rgba(0, 212, 255, 0.08);
  border: 1px solid rgba(0, 212, 255, 0.25);
  border-radius: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 2px;
  color: var(--cyan); text-transform: uppercase;
  margin-bottom: 14px;
}
.title-area h1 {
  font-size: 32px; font-weight: 700;
  letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 8px;
}
.title-area p { color: var(--text-secondary); font-size: 14px; }

.field { margin-bottom: 18px; }
.field label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 2px;
  color: var(--text-muted); text-transform: uppercase;
  margin-bottom: 8px;
}
.field input {
  width: 100%; padding: 14px 16px;
  background: rgba(5, 10, 26, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  color: var(--text-primary);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px; transition: all 0.2s ease;
}
.field input:focus {
  outline: none;
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
  background: rgba(5, 10, 26, 0.9);
}
.field input::placeholder { color: var(--text-muted); font-size: 14px; }

.btn-submit {
  width: 100%; padding: 16px 24px;
  background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-bright) 100%);
  border: none; border-radius: 10px;
  color: #000;
  font-family: 'Orbitron', monospace;
  font-size: 13px; font-weight: 800;
  letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 6px 32px rgba(0, 212, 255, 0.35);
  position: relative; overflow: hidden; margin-top: 8px;
}
.btn-submit::before {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transition: left 0.6s;
}
.btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(0, 212, 255, 0.5); }
.btn-submit:hover::before { left: 100%; }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.message {
  display: none; padding: 12px 14px;
  border-radius: 8px; font-size: 13px;
  margin-top: 16px; text-align: center;
}
.message.error {
  display: block;
  background: rgba(255, 53, 101, 0.1);
  border: 1px solid rgba(255, 53, 101, 0.3);
  color: var(--red);
}
.message.success {
  display: block;
  background: rgba(0, 255, 136, 0.1);
  border: 1px solid rgba(0, 255, 136, 0.3);
  color: var(--green);
}

.resend-btn {
  width: 100%; margin-top: 10px;
  background: rgba(0, 212, 255, 0.06);
  border: 1px solid rgba(0, 212, 255, 0.25);
  border-radius: 8px; color: var(--cyan);
  padding: 11px 14px; font-family: 'Space Grotesk', sans-serif;
  font-size: 13px; letter-spacing: 0.5px;
  cursor: pointer; display: none; transition: all 0.3s;
}
.resend-btn:hover { background: rgba(0, 212, 255, 0.12); }

.register-link {
  text-align: center; margin-top: 24px;
  font-size: 13px; color: var(--text-muted);
}
.register-link a {
  color: var(--cyan-bright); text-decoration: none;
  font-weight: 600; margin-left: 4px;
}
.register-link a:hover { text-decoration: underline; }

@media (max-width: 540px) {
  body { padding: 16px 12px; }
  .login-card { padding: 32px 24px; margin-top: 64px; }
  .title-area h1 { font-size: 26px; }
  .top-bar { padding: 12px 16px; }
  .logo { font-size: 16px; letter-spacing: 3px; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>

<div class="top-bar">
  <a href="/" class="logo">J4keIA</a>
  <nav><a href="/register.html">Créer un compte →</a></nav>
</div>

<div class="login-card">
  <div class="title-area">
    <div class="title-tag">◉ CONNEXION</div>
    <h1>Bon retour 👋</h1>
    <p>Connecte-toi pour accéder à ton espace trading.</p>
  </div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="toi@email.com" autocomplete="email"/>
  </div>
  <div class="field">
    <label>Mot de passe</label>
    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"/>
  </div>

  <button class="btn-submit" id="btnLogin" onclick="doLogin()">⚡ Se connecter</button>

  <div id="message" class="message"></div>
  <button class="resend-btn" id="resendBtn" onclick="resendEmail()">↻ Renvoyer l'email de confirmation</button>

  <div class="register-link">
    Pas encore de compte ?<a href="/register.html">S'inscrire gratuitement</a>
  </div>
</div>

<script>
const particles = document.getElementById('particles');
for (let i = 0; i < 20; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.animationDuration = (Math.random() * 15 + 15) + 's';
  p.style.animationDelay = (Math.random() * 15) + 's';
  particles.appendChild(p);
}

const params = new URLSearchParams(window.location.search);
if (params.get('verified'))  showMsg('✅ Email vérifié ! Vous pouvez vous connecter.', 'success');
if (params.get('registered')) showMsg('✅ Compte créé ! Vérifiez votre email puis connectez-vous.', 'success');
if (params.get('error'))     showMsg('❌ Lien invalide ou expiré.', 'error');

function showMsg(text, type) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.className = 'message ' + type;
}

async function doLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { showMsg('Remplissez tous les champs', 'error'); return; }

  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = '◷ Connexion...';

  try {
    const res  = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await res.json();

    if (data.error && (data.error.includes('Vérifiez') || data.error === 'email_not_verified')) {
      showMsg('⚠️ Vérifiez votre email avant de vous connecter.', 'error');
      document.getElementById('resendBtn').style.display = 'block';
    } else if (data.error) {
      showMsg('❌ ' + data.error, 'error');
    } else if (data.success) {
      showMsg('✓ Connecté ! Redirection...', 'success');
      setTimeout(() => window.location.href = data.redirect || '/', 1000);
    }
  } catch(e) { showMsg('❌ Erreur serveur', 'error'); }

  btn.disabled = false; btn.innerHTML = '⚡ Se connecter';
}

async function resendEmail() {
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) { showMsg('Entrez votre email', 'error'); return; }
  const btn = document.getElementById('resendBtn');
  btn.textContent = '⏳ Envoi...'; btn.disabled = true;
  try {
    const res  = await fetch('/resend-email', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
    const data = await res.json();
    if (data.success) { showMsg('✅ ' + data.success, 'success'); btn.style.display = 'none'; }
    if (data.error)   showMsg('❌ ' + data.error, 'error');
  } catch(e) { showMsg('❌ Erreur serveur', 'error'); }
  btn.textContent = "↻ Renvoyer l'email"; btn.disabled = false;
}

document.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
